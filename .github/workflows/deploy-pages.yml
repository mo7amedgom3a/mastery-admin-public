# Admin dashboard → Cloudflare Pages project `mastery-admin` (company account).
#
#   push to prod      -> build + deploy to production (https://admin.emasteryacademy.com,
#                        also https://mastery-admin.pages.dev)
#   pull request      -> build only (type-check + vite build)
#   workflow_dispatch -> redeploy the chosen branch (prod = production, anything else = preview)
#
# Repository settings:
#   secret   CLOUDFLARE_API_TOKEN   Account > Cloudflare Pages: Edit
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable VITE_STOREFRONT_ORIGIN storefront the Course Studio / lab previews frame and message
#                                   (https://landing.emasteryacademy.com); required
#   variable VITE_QA_LOGIN_ENABLED  "true" shows the QA login button; anything else hides it
#
# Runtime config lives on the Pages project, not here: API_PROXY_TARGET (production =
# https://api.v3.emasteryacademy.com, preview = the dev API) is read by functions/api/[[path]].js.
# VITE_* values come from repository variables and are inlined into the bundle at build time
# (public, not secrets).
name: Deploy admin (Cloudflare Pages)

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deploy:
    name: ${{ github.event_name == 'pull_request' && 'Build' || 'Build and deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_STOREFRONT_ORIGIN: ${{ vars.VITE_STOREFRONT_ORIGIN }}
      VITE_QA_LOGIN_ENABLED: ${{ vars.VITE_QA_LOGIN_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check build configuration
        run: |
          case "$VITE_STOREFRONT_ORIGIN" in
            https://*) echo "storefront origin: $VITE_STOREFRONT_ORIGIN" ;;
            *) echo "::error::Set the repository variable VITE_STOREFRONT_ORIGIN (https://…)"; exit 1 ;;
          esac

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.166.0 pages deploy dist \
            --project-name mastery-admin \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "$(git log -1 --format=%s | head -c 300)" \
            --commit-dirty=false

      - name: Smoke test
        if: github.event_name != 'pull_request' && github.ref_name == 'prod'
        run: |
          set -euo pipefail
          base=https://admin.emasteryacademy.com
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/login") && [ "$code" = 200 ] && break
            sleep 5
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/login")" = 200
          curl -sf "$base/api/v1/health" | grep -q '"healthy"'
          echo "admin + API proxy OK"
